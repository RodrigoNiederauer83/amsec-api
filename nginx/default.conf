server {
    listen 80;
    server_name secretinapp.tech api.secretinapp.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name secretinapp.tech;

    ssl_certificate /etc/letsencrypt/live/secretinapp.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/secretinapp.tech/privkey.pem;

    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name api.secretinapp.tech;

    ssl_certificate /etc/letsencrypt/live/secretinapp.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/secretinapp.tech/privkey.pem;

    location / {
        proxy_pass http://api:3333;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}