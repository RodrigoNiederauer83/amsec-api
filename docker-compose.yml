services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: secretin-api
    restart: unless-stopped
    env_file:
      - apps/api/.env
    volumes:
      - api-data:/data
    expose:
      - "3333"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: secretin-web
    restart: unless-stopped
    env_file:
      - apps/web/.env.production
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    container_name: secretin-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web

volumes:
  api-data: